name: Support request
description: Ask for help with setup, configuration, or operation.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Please read SUPPORT.md first. Remove credentials and private data before posting.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the intended outcome and where you are blocked.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Python version, database version, and installation method.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands, relevant logs, and the exact error message.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I read the README and SUPPORT.md and searched existing issues.
          required: true
        - label: I removed secrets, tokens, connection strings, and private data.
          required: true
