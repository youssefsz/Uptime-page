[project]
name = "uptime-page"
version = "0.1.0"
description = "A lightweight, self-hosted uptime monitor and public status page"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Youssef Dhibi" },
]
keywords = ["fastapi", "monitoring", "self-hosted", "status-page", "uptime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.13.0,<3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
    "argon2-cffi>=25.1.0",
    "slowapi>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/youssefsz/Uptime-page"
Issues = "https://github.com/youssefsz/Uptime-page/issues"
Repository = "https://github.com/youssefsz/Uptime-page.git"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1,<3",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.6,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
